services:
  - type: web
    name: lanchonete-pedidos
    runtime: python
    rootDir: servico_pedidos/infraestrutura/django_app
    buildCommand: pip install -r ../../requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn lanchonete.wsgi:application --bind 0.0.0.0:$PORT --workers 2
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost"
      - key: DATABASE_URL
        fromDatabase:
          name: lanchonete-db
          property: connectionString

databases:
  - name: lanchonete-db
    databaseName: lanchonete
    user: lanchonete_user
    plan: free
